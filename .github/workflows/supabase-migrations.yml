name: Supabase Migrations

# Pushes committed SQL migrations in hello-world/supabase/migrations/ to the
# linked Supabase project. Runs on merges to main that touch migrations, and
# can be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "hello-world/supabase/migrations/**"
      - "hello-world/supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

# Prevent two migration runs from racing against the same database.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # The Supabase CLI project lives under hello-world/, so run from there.
    defaults:
      run:
        working-directory: hello-world
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push
