- id: "N25"
  state: "actionable"
  title: "**The interview prep pack has NO READ SURFACE - nothing in the app ever shows a candidate their pack.** Found by the N16/N8 design round, 2026-09-15, and it reframes what \"fixing the prep pack\" means. **Measured, with a canary**: `readPrepPack` and `listPrepPacks` (`lib/interviewPrep/prepStore.js`) have ZERO non-test callers; there is no `GET` handler in `app/api/interview-prep/` (the directory holds only `route.js` and `route.test.js`); and no component renders a pack. The canary on the same instrument (`fetchApplicationDocs`) returned 40+ hits across routes and libs, so the absence is real and not a dead grep. **Consequence, and it must be said out loud when N16/N8 land**: those two items make the pack GENERATE correctly and LAND in the database grounded in the candidate materials - and the candidate still sees nothing. `prepTrigger.js:51-74` fires the POST and discards the response. Reporting N16/N8 as \"the prep pack now works\" would be false. **What this wave owes**: a `GET` on the prep route (or a direct client read - `prepStore.js`’s reads are deliberately browser-safe, its own header says so), a component, and the rendered disclosure notice `lib/interviewPrep/prepNotice.js [CORRECTION 2026-09-16: this file DOES NOT EXIST anywhere in the checkout -- verified with canary (prepNotice.js=0, prepParse.js=1). Do not look for it]` produces. **One rule the design round established that this wave must honour**: a `partial` pack renders the sections that exist WITH a visible \"some sections could not be generated - regenerate\" affordance. It must never render three of four sections as though the pack were complete - that is the same over-statement class as N8’s disclosure. **Also unresolved here**: `interview_prep_events` has a durable per-attempt log and `prepLog.js` exists (N7) with no specifying document; the read surface is where a \"download prep log\" control would live, per the standing feature-log directive [[feature-logs]]"
