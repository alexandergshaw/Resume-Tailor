- id: "N12"
  state: "actionable"
  title: "**`interview_prep_spend.attempts` is still client-resettable.** `authenticated` holds `grant update (attempts, updated_at)` because `claim_prep_pack_slot` is `SECURITY INVOKER` and increments `attempts` **as that role** — revoking it breaks every claim with a permission error. So a `PATCH` can set `attempts` to 0 and buy more retries. **Bounded, and adjudicated as acceptable for now**: every retry still increments `model_calls`, which only the `SECURITY DEFINER` `record_prep_model_call` can write, so the **money** cap holds regardless — exposure is capped at `model_calls <= 12`. **The fix**: make `claim_prep_pack_slot` `SECURITY DEFINER` with its own tenant checks, then revoke insert/update from `authenticated` entirely"
  owed_by: "A contract round (the contract currently specifies `SECURITY INVOKER`)"
  evidence: ["`20260914000000_interview_prep.sql:368-369`; flagged by the implementer rather than worked around"]
  blocked_reason: null
  instrument: null
  owns: null
  verify: null
  verify_proof: null
