- id: "N32"
  state: "actionable"
  title: "**The embedded (no-LLM) prep pack renders \"this role at this company\" for most real postings — a user-visible defect happening TODAY, and it does NOT need N26’s lexicon.** Measured 2026-09-15 end-to-end through the REAL `buildEmbeddedPack` → REAL `normalizePack`, no résumé, `digest: null`, no network (`pm-embedded-pipeline.mjs`): **9 of 11 (81.8%)** real in-repo `(title, company)` literal pairs produce at least one generic fallback in the generated `aboutYou` sentence, and **3 of 11 (27.3%) go fully generic simultaneously** — the candidate reads a sentence naming neither the job nor the employer. Cause: `safeInterpolationValue` (`lib/interviewPrep/prepPack.js:180`) screens `title` AND `company` through `containsDetectedName` and returns `null` for anything that reads as a detected name, which N16 wave G made uniform by deleting the `looksLikeJobTitle` carve-out (correctly — that carve-out leaked \"Director Maria Garcia\"). So ordinary titles (\"Senior Data Scientist\") and ordinary employers (\"Northwind Health\") both fall back. **CRITICAL DISTINCTION, measured not inferred: 0 of 11 lines were DROPPED.** The F-1 embedded-template exemption makes the \"line silently vanishes\" mechanism structurally unreachable on this path. **This is degraded WORDING, not data loss** — a quality defect, not an O-15 one. **Why this is separable from N26 and cheaper**: N26’s blocked half is the MODEL path’s K1-SHAPE drop risk, which needs the given-name lexicon. This defect is the EMBEDDED path’s fallback wording, where the failure is merely cosmetic and the pack already carries `templateOrigin`, so a fix has options N26 does not — e.g. a narrower screen for the interpolation site alone (R-N26-5 notwithstanding: site 3 does carry an FN stake, so any narrowing here still must not leak a real name into template wording), or richer fallback phrasing that degrades more gracefully than \"this role at this company\". **DENOMINATOR CAVEAT, do not quote 81.8% as a production rate**: no real posting data exists anywhere in this checkout (exhaustive search + canary, documented in `pipeline-measure.r1.md`); all 11 pairs are test-authored fixtures. The rate is over invented strings. A round that closes this should first obtain real `positions` rows and re-measure. **Also owed here**: `app/api/interview-prep/route.js:52-72` states N8’s blocking rationale in terms of lines being silently dropped, implying both paths share that risk. They do not — the embedded path cannot drop a line, and the model path’s rate has never been measured (only proxied at 5/35 = 14.3% of posting-shaped lines flagged). Correct that text to name the mechanism it actually protects against"
  owed_by: "A round that obtains real `positions` rows, re-measures, and fixes the embedded interpolation fallback — plus a one-paragraph correction to route.js:52-72’s rationale"
  evidence: ["`lib/interviewPrep/prepPack.js:180` (`safeInterpolationValue`), `:125-180` (the N16 wave G header explaining why the carve-out was deleted)", "`<memory>/loop-chunks/N26/pipeline-measure.r1.md` + `pm-embedded-pipeline.mjs` — 9/11 generic, 3/11 both-generic, 0/11 lines dropped", "`<memory>/loop-chunks/N26/pm-posting-proxy.mjs` — 5/35 (14.3%) posting-shaped lines flagged; a PROXY for the model path, never a measurement of it", "`app/api/interview-prep/route.js:52-72` — the rationale text needing correction"]
