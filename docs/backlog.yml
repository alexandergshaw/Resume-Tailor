- id: "N26"
  state: "actionable"
  title: "**N26’s DETECTOR IS BUILT, VERIFIED AND LANDED (2026-09-16). What is recorded here is only the RESIDUAL.** The owner-gated data dependency that blocked this item is CLOSED: the SSA national baby-names archive was obtained, and `lib/interviewPrep/data/givenNames.generated.js` (100,364 names, full unfiltered export, threshold 0) now ships with `scripts/generate-given-names.mjs` as a re-runnable, sha256-pinned provenance record. `containsDetectedName` is now a lexicon-gated, FIRST-WORD-only sliding-pair scan over maximal Title-Case runs. **Verified by a FRESH adversarial seat, not by its author**: all 8 white-box criteria hold against the diff; five faithful mutants (either-word, non-overlapping, org-guard-removed, dead-lexicon, plus a no-op control) were run against the REAL landed tests and every non-trivial mutant was killed by a named test while the no-op survived; and **0 of 23 previously-demonstrated real-name leak sentences reproduce** against the live `normalizePack`. **THE RESIDUAL, in priority order.** **(a) The ~57% employer-pair share is STILL UNADDRESSED and nobody has scoped it.** The FP residual split 43% job titles / 57% employer pairs; a given-name lexicon addresses only the former. An \"Acme Robotics\"-shaped employer pair needs an org-name signal that has never been designed or costed. **(b) BOTH corpus ceilings are at EXACTLY zero headroom** — re-measured independently against the live module: PROBE_106 **9/106** against a ≤9 ceiling, skills taxonomy **12/270** against a ≤12 ceiling. Any future change that adds a single false positive trips a gate. These are REGRESSION DETECTORS, not certification (R-N26-9), and must not be raised to buy room. **(c) The `!ORG_SUFFIX_WORDS` guard has exactly ONE instrument** — the PROBE_106 numeric ceiling, with no structural backup; accepted under R-N26-9, named for visibility. **(d) `prepParse.test.js` is 1262 lines, over this repo’s 1000-line ceiling** (R-N26-14): owed to a separate MECHANICAL seat now that the tests are green — moving helpers only, changing no assertion, and the WB-3 wiring test’s non-enumerability (stride rule over the shipped array’s runtime length) MUST survive the move. **(e) Two documentation overclaims**: `prepParse.test.js`’s `strideSample` comment claims the file’s source text names no given name anywhere — falsified by `\"Kevin Chen\"` at `:669` and 70 pre-existing `\"Jane Doe\"` occurrences (the tests’ actual property is intact; only the comment’s scope is wrong); and `ac.r5.md`/AC-N26.31’s size figures (755,579B/333,373B) describe the source list, not the shipped module (1,260,040B raw / ~348KB gzip). **(f) The lexicon must not reach the browser** — R-N26-13: `prepStore.js:62` imports `prepParse` and declares itself browser-bundleable. There are ZERO `\"use client\"` importers today (canary-checked), so this holds for now and BREAKS when N25 lands a read surface. Owed by N25/N33’s wave, which must prove the bundle does not carry the lexicon. **DO NOT re-open the closed parts**: do not widen `ORG_SUFFIX_WORDS`, do not revive the `looksLikeJobTitle` allow-list, do not attempt a synthetic given-name corpus or the \"Track F\" suffix fallback — all four were built and refuted. **METHOD TRAP for anyone working this file**: plain `grep` without `-a` reports \"binary file matches\" on `prepParse.test.js` and silently returns NOTHING for patterns that are present"
