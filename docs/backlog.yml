- id: "N14"
  state: "actionable"
  title: "**The unconditional `UPDATE … SET` list in `writePrepPackResult` is the actual defect — not merely `finishAttempt()`'s fallback retry.** `writePrepPackResult`'s `pack` parameter defaults to `null` (`prepStore.js:367`), and its `UPDATE … SET` list writes `pack` (`prepStore.js:394`) and `posting_fingerprint` (`prepStore.js:397`) **unconditionally** — so ANY terminal write that omits either of those two `not null default` columns (`20260914000000_interview_prep.sql:155`, `:159`) sets NULL into it. A column DEFAULT does not apply to an explicit `SET col = NULL`, so that write arrives as SQLSTATE **23502**, which the fallback's own predicate excludes (`isCheckViolation` matches only `23514`) — no fallback fires for it. This is broader than the fallback write alone (`finishAttempt.js:59-66`, which supplies no `pack` and is equally exposed): **four primary-write call sites also never supply `pack`** — `route.js:333-339` (GATE 10's `unavailable` write), `route.js:403-410` (the provider-timeout/provider-error write), `route.js:417-424` (the parse-failure write), and `route.js:255` (`refuseRecordingFailure`'s `spend-record-failed` write, whose `ctx` is built at `route.js:373-380`). **Checked, not assumed**: all four of those sites DO supply `postingFingerprint` (the route's own `fingerprint` variable, computed unconditionally before any branch) — so today's 23502 is driven by the `pack` column alone at every one of them; `posting_fingerprint`'s unconditional write is the identical latent hazard for any future caller that omits it, but no current call site does. **Worked scenario**: a posting with an empty description → GATE 10 issues `SET pack = NULL` → 23502, not 23514 → `isCheckViolation(write)` is false → no fallback, no event row, a raw Postgres NOT NULL message returned to the client with a 500 — and because the UPDATE failed, `lease_until`/`lease_token` are never cleared, so the row stays `running` and `claimPrepPack` refuses every retry until the lease expires. **Related**: `buildEmbeddedPack` (`app/api/interview-prep/route.js:172-198`) emits `claims: {}` and omits `aboutYou`/`whyRole`/`askThem`, which the migration's `interview_prep_packs_claims_is_array` (`:219-220`) and `interview_prep_packs_ready_is_complete` (`:194-211`) CHECKs would reject on every embedded `ready` write — putting this broken fallback on the hot path. **Instrument limit, stated honestly**: this is read off the declared DDL and the code path, never executed — no live Postgres is reachable from this checkout (the same limitation **D1** already carries; this item is informationally coupled to it). What would settle it: run all five UPDATE statements (the four call sites above plus the fallback's minimal `failed`/`check-violation` write) against the linked Supabase project and paste back the resulting SQLSTATEs"
  owed_by: "A design round deciding whether `writePrepPackResult` should omit unsupplied columns from its `SET` list, and whether the fallback predicate should widen to the `23xxx` class"
  evidence: ["`lib/interviewPrep/finishAttempt.js:59-66`", "`lib/interviewPrep/prepStore.js:367`, `:394`, `:397`", "`supabase/migrations/20260914000000_interview_prep.sql:155`, `:159`, `:194-211`, `:219-220`", "`app/api/interview-prep/route.js:172-198`, `:255`, `:333-339`, `:373-380`, `:403-410`, `:417-424`"]
  blocked_reason: null
  instrument: null
