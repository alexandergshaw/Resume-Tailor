- id: "N30"
  state: "actionable"
  title: "**The committed lockdown migration describes a cleanup block and `anon` revokes that NEVER RAN, and every table in `public` still grants TRUNCATE/REFERENCES/TRIGGER to `anon` and `authenticated`.** Two findings from verifying V2 against the live project, 2026-09-15. **(a) A stale migration file, and the cause is an orchestration error.** `supabase/migrations/20260915000000_interview_prep_spend_lockdown.sql` shipped in `3d9bb27`, and the GitHub Action (`.github/workflows/supabase-migrations.yml`, `supabase db push` on any push touching `supabase/migrations/**`) applied it. Later rounds then CORRECTED THAT FILE IN PLACE and pushed again in `0e83c97` - but `db push` keys on the version stamp, so the edited file was skipped. The committed text now claims a cross-tenant cleanup block, `anon` revokes, and a `raise exception` guard **that are not in the database**. A reader of that file will believe otherwise. This is the exact editing-an-applied-migration hazard the file itself warns about, committed by the orchestrator on a stale premise. **What IS live, verified by query**: `authenticated` holds SELECT only on `interview_prep_spend` (N12 closed); both functions are `prosecdef = true` with `search_path` pinned empty; `proacl` carries no `=X/` entry, so PUBLIC has no execute and `anon` none either; and **zero cross-tenant rows exist**, so the cleanup block was always a no-op on this project. **(b) Schema-wide least privilege, NOT a vulnerability.** Every table in `public` grants `TRUNCATE`, `REFERENCES` and `TRIGGER` to both `anon` and `authenticated` - `applications`, `generated_resumes`, `experience_pages`, all of them. This is Supabase’s DEFAULT posture, not something a migration here granted; the migrations revoked DML and never touched these. **No known path reaches them**: `anon`/`authenticated` are not login roles (PostgREST connects as `authenticator` and SET ROLEs), PostgREST exposes no TRUNCATE, and REFERENCES/TRIGGER need DDL. TRUNCATE would bypass RLS if it were reachable, which is why it is worth removing on principle. **Do NOT fix (b) with a one-table revoke** - that was the unapplied correction, and doing it for `interview_prep_spend` alone is inconsistent and buys nothing. **REFERENCES in particular may be load-bearing** for any hand-added foreign key, so this needs a design round and a `pg_constraint` survey before anything is revoked across 20+ tables"
  owed_by: "(a) a new migration with a LATER timestamp carrying whatever of the corrections is still wanted - never another edit to 20260915000000; (b) a design round for schema-wide least privilege, with a survey first"
