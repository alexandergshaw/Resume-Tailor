- id: "N34"
  state: "actionable"
  title: "**N34 WAS WRITTEN ON A STALE READ: the prep prompt DOES already tell the model not to name people. RE-SCOPED 2026-09-16 to what is actually missing.** The original entry claimed `buildPrepPrompt` \"never instructs the model to avoid naming anyone in the first place\", and therefore that O-15 is \"a post-hoc filter over output we never asked to be clean\". **Both halves are false, verified by direct read** at `app/api/interview-prep/route.js:211-212`, which carries TWO instructions: *\"Write aboutYou and whyRole in the first person. Never write the candidate’s own name, or any person’s name, in those two sections.\"* and *\"Never name, describe, or predict which specific person will conduct or attend any interview, however confident you are -- that is forbidden.\"* Both landed in `0e83c97` under N22/N16, NOT under N34, which is why the N26 re-scope did not see them. **WHAT REMAINS GENUINELY OWED, and it is the part the original entry got right**: (a) **nothing tests that the instruction works.** The instructions are unverified against real model output — no AC, no test and no measurement exercises them, so their effect on the refusal rate is unknown. (b) **The original entry’s own warning is the binding constraint on any such test**: a model instruction is not enforcement, the refusal path stays, and an AC must assert on the PACK OUTPUT, never that the prompt string contains a sentence — asserting a prompt CONTAINS text is a zero-power measurement that would pass today, before any work. (c) The FP context still holds but its numbers are SUPERSEDED: the detector’s false-positive rate was 62/106 (58.5%) on résumé prose, and N26’s lexicon-backed detector has since LANDED, so the current rate must be re-measured rather than quoted from either figure. **Do NOT re-add a naming instruction** — that is the whack-a-mole this correction exists to prevent; the text is already there"
  owed_by: "A measurement round that exercises the EXISTING instructions against real model output (never against the prompt string), scoped with N8’s résumé wiring and its 1g prompt review"
