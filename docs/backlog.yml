- id: "N17"
  state: "actionable"
  title: "**Voice enrollment: identify the candidate's own voice from an uploaded sample of them reading an app-provided passage.** Owner request, 2026-09-14. **Scope is narrower than it sounds, and the survey is why**: for a REMOTE interview the app already separates the two voices by CHANNEL — `lib/copilot/capture.js` takes the candidate's own voice from `getUserMedia` (mic) and the other party's from `getDisplayMedia` (tab/system audio), so enrollment adds nothing there. The case that actually needs this is the **SHARED MICROPHONE / in-person** session, which is exactly what `lib/copilot/speakerIdentity.js` exists for today — and it identifies the candidate BEHAVIOURALLY (word share, question detection, confidence gates), not by voice. **The motivating failure is already documented in that file's header**: v1 scored on word share alone and elected the INTERVIEWER as the user at 'high' confidence on two real interview openings, after which the copilot stopped evaluating their speech for questions and went **silently deaf for the rest of the session** — the file calls this the worst failure mode the feature has, because the user cannot tell it happened. A voiceprint replaces a heuristic that is known to fail silently, which is the strongest case for building it. **THE FEASIBILITY CRUX, unresolved**: diarization as wired today (`lib/copilot/stt/index.js`, Deepgram and ElevenLabs Scribe) yields ANONYMOUS speaker tags (`speakerTag` = provider-assigned id), never an identity — binding tag→person needs either provider-side speaker enrollment/verification or a locally-run speaker-embedding model, and NEITHER is confirmed available on the current providers. That question must be settled at primary source BEFORE any UI is designed, or the enrollment flow gets built against a capability that does not exist. **Why an app-provided passage is the right call** (the owner asked for it and it is correct): a known transcript gives phonetic coverage, lets the app verify the upload is actually someone reading THAT passage rather than arbitrary audio, and supports a quality gate (too short, too noisy, clipped) before a bad enrollment silently degrades every later session. **A voiceprint is BIOMETRIC data** — distinct from the recordings the copilot already stores — **OWNER RULING, 2026-09-14: storing the candidate's voice is PERMITTED, provided they are made aware of it and consent.** That settles whether the feature may exist. Three things it does NOT settle, and a design round must: (a) what deletion looks like — consent to store is not consent to keep forever, and the copilot already ships a delete control precedent (O-16's per-application delete) rather than a tombstone; (b) whether the consent is one-time at enrollment or re-surfaced, and where the disclosure actually appears — this repo has already shipped a disclosure that OVER-STATED what left the app (see N8), so the notice text must be checked against what is actually sent; (c) **conditional, and only if the research round finds provider-side enrollment is the ONLY feasible path**: consent to the APP storing a voiceprint is not obviously consent to transmitting it to a third-party STT vendor, which is a separate egress the owner should rule on once it is known to be necessary"
  owed_by: "A 3b research round settling provider speaker-ID/enrollment support at primary source and an owner ruling on biometric storage, THEN a design round, THEN the wave that builds it"
