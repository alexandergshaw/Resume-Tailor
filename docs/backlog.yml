# docs/backlog.yml — source of truth for the backlog. docs/BACKLOG.md is GENERATED from this file
# by hello-world/scripts/backlog/render.mjs — never hand-edit BACKLOG.md, edit this file and re-render.
#
# Schema per item (every field present on every item; unused ones are null):
#   id             - unique, namespaced: N = actionable, D = owner decision, V = verification owed
#   state          - "actionable" | "owner" | "verification"
#   title          - the Item/Question cell (markdown, full text)
#   owed_by        - actionable only: the "Owed by" cell
#   evidence       - actionable only: array of the "Measured how" cell text (kept as one element per
#                    cell at migration — see below on why it is not forced into file:line pairs)
#   blocked_reason - owner only: the "Why it is blocked" cell
#   instrument     - verification only: the "Measured how" cell (the exact instrument the owner runs)
#   owns           - actionable only, nullable: glob(s) of files this item edits; null = not yet scoped
#   verify         - actionable only, nullable: the command that proves this item is done; null = not
#                    yet scoped. NEVER fabricate this to make an item look complete — an invented
#                    verify is a gate that compares a guess to itself.
#   verify_proof   - populated only once the three-part-plus-kill authoring gate (fails on HEAD,
#                    passes on a real fix, is KILLED by reverting the fix, survives a no-op edit —
#                    see scripts/backlog/lib/contract.mjs) has actually proven `verify` can fail for
#                    the right reason; null until then
#   blocked_by     - array of other items' ids. A NON-EMPTY list blocks this item unconditionally,
#                    whether or not the named id still exists in this file — resolving a blocker is
#                    always an explicit edit removing its id here, never inferred from the id's
#                    disappearance (a closed item is deleted per this file's own "no diary" rule, so
#                    disappearance cannot be told apart from a typo'd id). See scripts/backlog/lib/blocked.mjs.
#
# `owns`/`verify` are left null for every item below, deliberately. This is Phase 1 of a two-phase
# migration: a lossless, mechanical transcription of the existing docs/BACKLOG.md (this file), and a
# separate, later, judgment-heavy chunk that scopes each item's owns/verify one at a time under the
# authoring gate. Scoping 12 of 15 items by guessing here would be the exact "verify that cannot fail"
# defect this tooling exists to prevent — see N1's own note: its most obvious verify command already
# passes today, before any fix, because the code's existing test suite was never written against the
# input this item objects to.

