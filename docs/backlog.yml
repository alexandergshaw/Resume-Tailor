- id: "N35"
  state: "actionable"
  title: "**OWNER REQUEST 2026-09-20, second-highest priority. Feed the company-facts pipeline into the cover letter and the outreach email — but ONLY facts the candidate has verified through the preview/edit modal.** The app already researches a company and already writes cover letters, and the two never meet: the tailor path (`app/api/tailor/route.js`) generates the cover letter, while company facts live in a separate pipeline (`app/api/company-research/route.js`, `lib/tracking/digestCitations.js`, `app/copilot/CompanyBriefPanel.js`, `app/components/CompanyResearchDialog.js`). So a cover letter today says nothing specific about the employer, which is the single thing that makes a cover letter read as written-for-them. **THE GATE IS THE POINT, and it is what makes this item different from \"put the digest in the prompt\"**: a company fact is exactly the kind of claim a model will confidently invent, and an invented fact about the employer, in a document the candidate SENDS, is the worst failure this app can produce — strictly worse than a thin letter. So no fact may reach a letter or an email until the candidate has seen it and accepted it in the preview/edit modal. **Design constraints, carried from what this repo already learned**: (i) the pack/digest work already established that grounding claims need real publisher URLs — `web.uri` values from Gemini grounding are vertexaisearch REDIRECTS, so any host-based corroboration check silently drops every citation (see the grounding memory and N26-era rulings); a verified fact must carry a real source the candidate can click. (ii) The verification state must be STORED and must be what the generator reads — not re-derived, and not a flag the model can write. This is structurally the same trust problem as N33’s user-supplied names: the only values that get privileged treatment are the ones the USER accepted. Reuse that ruling rather than inventing a second mechanism. (iii) Standing directive \"minimize clicks\": verification is the one confirmation that earns its keep here, so it must be ONE pass over the facts with good defaults — not a per-fact wizard. (iv) Say explicitly what happens to a letter generated when ZERO facts are verified; that is the common case on day one and it must degrade to today’s behaviour, not to a broken document. **UNMEASURED, and a scoping round must measure it first**: nothing here has been measured — not how many facts a typical digest yields, not how many survive verification, not whether the email path exists as a generator at all (`lib/gmail/gmailClient.js` sends; whether anything GENERATES the outreach email body is unestablished). Do not let an implementer infer these"
  owed_by: "A scoping round that measures the current state first (does an email generator exist? what does a digest actually yield?), then a design round for the verification gate and its storage, then the wave that wires it"
  evidence: ["`app/api/tailor/route.js` — the cover-letter generator; `app/api/company-research/route.js` — the facts pipeline; the two are unconnected (grep-located 2026-09-20, not yet measured)", "`lib/tracking/digestCitations.js`, `app/copilot/CompanyBriefPanel.js`, `app/components/CompanyResearchDialog.js` — existing company-fact surfaces to reuse rather than rebuild", "`lib/gmail/gmailClient.js` — sends mail; whether any module GENERATES an outreach email body is UNVERIFIED and is the first thing a scoping round must settle", "N33 — the user-accepted-values trust pattern this must reuse, not re-invent; `<memory>/gemini-grounding-redirects` — why a citation host check silently drops every source"]
