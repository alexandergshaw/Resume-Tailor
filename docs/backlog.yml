- id: "N26"
  state: "actionable"
  title: "**`containsDetectedName` cannot tell a person from a product. MEASURED 2026-09-15, and the fix is now owner-gated on a data dependency.** `prepParse.js:45`’s `NAME_PAIR_RE` matches ANY consecutive Title-Case pair whose second word is outside a 23-entry org-suffix list, so résumé prose (\"React Native\", \"Apache Kafka\", \"Google Cloud\") reads as a person’s name. Under the O-15 pack contract a name-detected line carrying no citation is REFUSED, and in `aboutYou`/`whyRole` a refusal is a DROP, so feeding a résumé in silently deletes the candidate’s own material. **THE BASELINE, measured by execution against a byte-identical copy of the live module (sha `40f44c5`), not estimated**: **62/106 (58.5%)** false positives on an independently-authored résumé/employment corpus (`lib/resume/parseEmployment.headerDateSpan.test.js:35-151`, an unrelated chunk’s fixture) and **92/270 (34.1%)** on this product’s own live skill taxonomy (`lib/llm/engines/tailor-lite/data/skills_taxonomy.json`). **The majority of ordinary résumé prose is refused, not a minority.** **THE RESIDUAL SPLITS 43% job titles / 57% employer pairs** — load-bearing, because a given-name lexicon addresses at most the 43%; the employer-pair half (\"Acme Robotics\"-shaped) needs an org-name signal nobody has scoped or costed. **THREE GATE DESIGNS WERE BUILT AND ALL THREE WERE DEFEATED**, each by a fresh adversary, and the attacks are preserved so a later round starts from them rather than re-deriving them (`<memory>/loop-chunks/N26/`: `d2-attack.mjs`, `d2-attack2.mjs`, `check-ac.r1.md`, `check-ac.r2.md`, `check-ac.r3.md`). (i) A 29-token gazetteer seeded only from strings the AC itself printed passed EVERY criterion while leaking 10/10 real names incl. \"Director Ana Ruiz will meet you on the panel.\" (ii) A synthetic name generator (mulberry32, ~2.19B combinations) was defeated by ONE phonotactic regex read off the committed generator — every emitted token ends in a vowel, recognising 4000/4000 generated and 1/31 real tokens, so a build detects *synthetic-ness*, not names. (iii) A no-lexicon fallback (\"Track F\", a 19-word suffix set) was REFUSED by owner ruling: it moved FP only **58.5% → 56.6%**, 15 of its 19 words rescue ZERO rows on any corpus, its 4 live words are derived from the three examples printed at `route.js:57`, and it **REGRESSED the security direction** — `\"Anna Kafka gave the keynote.\"` survives UNCITED through the real `normalizePack`, so a real person surnamed Kafka/Lake/Stack would leak. **THE CLASS, learned three times: only real names are indistinguishable from real names.** A corpus that is derivable (i) or distinguishable (ii) certifies the wrong predicate. **WHAT IS NOW OWED — an owner decision, not an agent task**: sourcing an external given-name lexicon (leading candidate: US SSA national baby-names, public-domain US federal work, ~90-100k names — **unverified, no session has had network access to confirm licence or size**, and nothing usable ships in this repo or `node_modules`). Ruling R-N26-4 permits it with THREE BINDING conditions: (1) the detector’s lexicon and the FN gate’s corpus are disjoint slices of DIFFERENT sources, split mechanically — never by instruction, which N4 already records failing; (2) cultural skew MEASURED and reported PER SLICE, never pooled, with particles (\"van der Berg\"), hyphenated and three-word names in the held-out slice — a detector that guards some candidates’ names better than others is a defect in this product; (3) unseen-token invariance re-scoped to tokens OUTSIDE the lexicon. **Two holes in those conditions are known-open and must close BEFORE a lexicon ships**: nothing mechanically verifies a claimed lexicon’s provenance (a fabricated 5,000-entry list passes the letter of the rule), and an implementer can tune to the named skew categories while failing an unenumerated one. **Do NOT widen `ORG_SUFFIX_WORDS`** (owner ruling, standing) and do NOT re-attempt a synthetic FN corpus. **N8 STAYS BLOCKED** by this item"
  owed_by: "An OWNER decision on sourcing the given-name lexicon (needs network access to verify licence/size), then a round under ruling R-N26-4’s three conditions — and separately a scoping round for the 57% employer-pair share, which no lexicon addresses"
  evidence: ["`lib/interviewPrep/prepParse.js:45` (`NAME_PAIR_RE`), `:48-52` (heuristic disclosed as weak by design), `:53-77` (the 23-entry list)", "baseline: 62/106 on `lib/resume/parseEmployment.headerDateSpan.test.js:35-151`; 92/270 on `lib/llm/engines/tailor-lite/data/skills_taxonomy.json` — reproduced by three independent agents", "`lib/interviewPrep/prepParse.test.js` ~:620 — the AC-N8.2 control still encoded as `it.fails(...)`, with its companion control at ~:638 that must survive any conversion", "`lib/interviewPrep/prepPack.js:150-158` — site 3 (`safeInterpolationValue`) carries a full FN stake; its own wave-G header calls the leak an O-15 violation", "`<memory>/loop-chunks/N26/` — ac.r1-r3, check-ac.r1-r3, ledger.md (rulings R-N26-1..7), and the two working attack scripts", "backlog N4 — the same held-out-corpus trap, recorded before this chunk reproduced it twice more"]
