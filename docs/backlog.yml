- id: "N37"
  state: "actionable"
  title: "**`upsertInterviewStage`’s UPDATE has no ownership predicate AND rewrites the row’s owner. RLS is the only guard.** Found by the N33 1g security seat, ESCALATED by the r2 reconciliation, and verified by direct read 2026-09-20. **(a) No predicate.** `lib/supabase/upsertInterviewStage.js:42-49`: the update branch is `supabase.from(\"interview_stages\").update(payload).eq(\"id\", stageId)` — `userId` is accepted as a parameter and never used in the predicate. `getInterviewStages` (`:80-86`) likewise selects on `application_id` alone. **(b) WORSE, and this is the escalation: the update REASSIGNS OWNERSHIP.** The `payload` object built at `:30-40` carries `user_id: userId` and `application_id: applicationId` as its first two keys, and `:46` sends that SAME object to `.update()`. So an update does not merely modify `stage_name`/`outcome`/`notes`/`interviewer_names` on a row the caller may not own — it overwrites that row’s `user_id` and `application_id` with the caller’s own, moving the row into the caller’s account. A cross-account write is therefore a takeover, not just a mutation, and it would also silently relocate a stage between applications on an ordinary same-user edit that passed a mismatched `applicationId`. **Why RLS being the sole guard is not reassuring**: `interview_stages` has NO `CREATE TABLE` migration in this repo (positive controls `interview_prep_packs`=1, `experience_pages`=2, canary=0), so the policy doing all the work cannot be read from this checkout and no session has verified it against the live project. **NOT a demonstrated exploit**: no path has been shown from untrusted input to an attacker-chosen `stageId`, and RLS may well refuse it. This is absent defence-in-depth behind an unverifiable guard. **OWNER DECISION 2026-09-20: fixed inside the N33 chunk**, which touches this path anyway. **The fix**, per `design-reconciled.r2.md` §RD-N33.9: add `.eq(\"user_id\", userId)` to the UPDATE and to the read, and stop sending `user_id`/`application_id` in an update payload at all. **The test must FAIL before the fix** — a cross-account update returns `null` and leaves the seeded row byte-unchanged, built on the existing `makeStatefulSupabase` harness (its header records that `.single()` on 0 rows yields PGRST116). A test green both before and after is asserting the mock, not the predicate. **No longer the trust anchor**: the N33 exemption moved to a dedicated table on 2026-09-20, so this is now defence-in-depth rather than load-bearing for O-15"
  owed_by: "The N33 chunk, per owner decision 2026-09-20 — with the live-RLS verification recorded separately as owed"
  evidence: ["`lib/supabase/upsertInterviewStage.js:30-40` (the shared payload carries `user_id`/`application_id`), `:42-49` (UPDATE predicate is `id` only), `:80-86` (`getInterviewStages`) — read directly 2026-09-20", "callers: `app/hooks/useApplicationDialogs.js`, `lib/tracking/stages.js`", "`<scratchpad>/chunks/N33/design-security.r1.md` §4.2 (found) and `design-reconciled.r2.md` §RD-N33.9 (the fix + failing-first test)", "`interview_stages` has no CREATE TABLE migration, so the sole guard is unreadable from this checkout"]
