- id: "N24"
  state: "actionable"
  title: "**The live interview panel is too small to be useful on non-mobile screens.** Owner report, 2026-09-15. The copilot dashboard is the surface a candidate reads WHILE being interviewed, and on a laptop or desktop it wastes most of the window. **Grounded in the constraints that produce it, not a vibe**: the sticky question band is capped at **30% of the viewport height** - `BAND_BASE_DVH` in `app/copilot/stickyQuestionGuards.test.js:48` pins `max(calc(64px + 4.25rem), calc((100dvh - var(--sticky-top, 0px)) * 0.30))` - so on a 1080p screen the question and its answer share roughly a third of the height while two thirds sit empty. The voice-cue rail then takes a fixed **280px** at `md` and up (`app/copilot/VoiceCueSidebar.js:30` `RAIL_SX`), which is a far larger proportional bite at 1280px than the layout was tuned for. The column arithmetic (`CopilotClient.js:862`, `:873`, `:904`) is a `flex: 1 / minHeight: 0` chain written so the pieces fit on a phone, and it holds the same shape all the way up. **Almost every sizing decision in this surface was made for the phone case and never re-judged for the desktop one** - see [[copilot-mobile]], which records the mobile pass; there has been no desktop equivalent. **What this must NOT become**: more panels visible at once. The candidate is reading this while a person waits for them to speak, so the goal is BIGGER TYPE AND FEWER THINGS, not denser information - the [[minimize-clicks]] reasoning applied to attention rather than clicks. **A design round should settle**: what the desktop breakpoint gives back to the answer area; whether the rail collapses, docks or moves at `lg`+; whether the band cap should be a function of available height rather than a fixed fraction; and what the reading distance actually is (a laptop at arm length is not a phone at 30cm, and the type scale never changed). **Measurement limit, stated honestly**: this repo cannot measure real layout - jsdom computes no geometry and the browser pane needs