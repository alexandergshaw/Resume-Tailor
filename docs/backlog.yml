- id: "N33"
  state: "actionable"
  title: "**The candidate supplies the names; the app supplies none.** OWNER RULING 2026-09-15, and it dissolves the problem four N26 AC rounds could not solve. The prep pack has no way for a candidate to say \"my name is X\" or \"I am being interviewed by Y and Z\", so every name in a pack is either model-asserted (the O-15 hazard) or absent. Once the app generates NO names it never has to separate \"Senior Data Scientist\" from \"Analyst Robert Klein\" by structure — three independent agents failed at that, because the distinguishing fact is semantic. A name-shaped token in MODEL output becomes a defect by definition, and the only legitimate names are the ones the user typed, **exempted by LITERAL MATCH rather than by inference**. **THE ONE DANGEROUS PART**: an exemption keyed on anything the MODEL can influence is a laundering path for ANY name past O-15 — it must match against STORED, USER-ENTERED values only, never a field the model can write into, and never a value arriving on the same object the model populates (`pack`). **OWNER DECISIONS, as they now stand.** (1) The candidate’s own name is stored **ONCE PER ACCOUNT** (2026-09-16). (2) **REVERSED 2026-09-20 on new evidence**: interviewer names go in a **DEDICATED TABLE**, NOT the existing per-stage `interview_stages.interviewer_names`. The 2026-09-16 reuse ruling is SUPERSEDED. **The three facts that reversed it, each verified**: (i) `interview_stages` has no `CREATE TABLE` migration, so its RLS cannot be read from this checkout, yet reuse would make it the TRUST ANCHOR of the exemption; (ii) `lib/supabase/upsertInterviewStage.js:42-49` — the UPDATE branch is `.update(payload).eq(\"id\", stageId)` with **no `user_id` predicate** (`userId` is taken as a parameter and used only in the INSERT payload), and `getInterviewStages` `:80-86` filters on `application_id` alone, so RLS is the ONLY guard on a cross-account write to `interviewer_names`; (iii) storage is per-STAGE while the user thinks per-APPLICATION, so a name entered against an application with zero stages required auto-creating a reserved \"name-holder\" stage row plus a marker that every stage-chip renderer must filter, or a **phantom interview stage** appears on the tracking card (`app/components/tracking/ApplicationCard.js:125-170`). The dedicated table deletes all three. (3) The read surface is the **tracking-row dialog** (`AppViewDialog`), not `/copilot`. **THE MATCHING RULE IS WHOLE-SPAN, and a bypass was already caught in a draft**: a case-insensitive SUBSTRING check lets a stored name that is also an ordinary word (\"Will\", \"Rose\", \"Mark\", \"Grace\") exempt ANY line containing that word, and lets a correctly-stored own-name exempt a whole line that also carries an unrelated uncited name. Whole-span, per-detected-span, case-sensitive, NFC-normalised, trimmed, whitespace-collapsed equality closes both. **Residual disclosed, not fixable by literal matching**: a real namesake sharing a stored name’s exact string is exempted — inherent to the approach R-N26-10 chose. **LANDMINE, measured**: `normalizePack` runs at THREE call sites — `app/api/interview-prep/route.js:455` and `lib/interviewPrep/prepStore.js:377` (both on WRITE, so twice per write) and `prepStore.js:188` (on READ). An exemption applied at one site silently un-exempts on the next pass, and a future fourth call site needs a source-text sweep to catch — a behavioural test cannot. **BUNDLE, sharper than R-N26-13**: the bundle unit is the FILE — `prepStore.js:62` and `prepPack.js:32` import `prepParse.js` at module scope, so a client import of even a lexicon-free export drags in the 1.26MB lexicon; the read surface must not import `prepStore`/`prepParse`/`prepPack` client-side at all, and takes a server-only `GET` on `route.js` (precedented by its `DELETE`). **Scoped WITH N25**; **N8 must NOT land before this**"
  owed_by: "Design round is DONE (survey, AC r1 with 21 criteria, structure r1, experience r1, security r1). Owed now: a structure+experience REVISION reconciling both to the dedicated-table ruling and to \"once per account\", then TDD tests, then the build. Blocked on nothing"
  evidence: ["`<scratchpad>/chunks/N33/`: `survey.r1.md`, `ac.r1.md` (AC-N33.1..21), `design-structure.r1.md`, `design-experience.r1.md`, `design-security.r1.md`", "`lib/supabase/upsertInterviewStage.js:42-49` (UPDATE has no `user_id` predicate) and `:80-86` (`getInterviewStages` filters on `application_id` only) — read directly 2026-09-20", "`normalizePack` call sites, grepped with canary: `app/api/interview-prep/route.js:455`, `lib/interviewPrep/prepStore.js:377`, `lib/interviewPrep/prepStore.js:188`", "`lib/interviewPrep/prepStore.js:62`, `lib/interviewPrep/prepPack.js:32` — module-scope imports of `prepParse.js` (the file-level bundle unit)", "`interview_stages` has no CREATE TABLE migration — positive controls `interview_prep_packs`=1, `experience_pages`=2, canary=0", "owner rulings: `<memory>/loop-chunks/N26/ledger.md` R-N26-10/R-N26-11; decisions 2026-09-16; decision (2) REVERSED 2026-09-20"]
