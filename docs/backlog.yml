  title: "**Two residuals deferred out of N16 wave C, both about packs that already exist or lines that were silently dropped.** **(a) Legacy packs keep three orphaned top-level keys.** Rows written before N16 stored `tellMeAboutYourself`/`whyThisPosition`/`questionsToAsk` at the TOP level plus a flat `sections.stages` array. Wave C added a read-time limb so the flat stages still resolve, but the three top-level keys are never migrated into the new `sections.{aboutYou,whyRole,askThem}` - they survive as keys nothing will ever read again, and those packs therefore render as missing three of four sections once a read surface exists (N25). Needs a data migration, or a documented decision that legacy rows are regenerated rather than migrated. **(b) `refusedLines` has nowhere to go.** `countRefusedLines` is called once in `route.js` and written to `console.warn`. There is no column for it (`interview_prep_packs`’ contract is `{version, sections, claims}` per the migration’s own comment at `20260914000000_interview_prep.sql:153`, which is why the field was removed from the persisted document). So the ONE signal that the name-detector silently deleted a candidate’s content is a server log line nobody reads. `interview_prep_events` already exists as the durable per-attempt log and is the obvious home. **Why (b) matters more than it looks**: N26 records that `containsDetectedName` drops real résumé and first-person prose, and a checker measured 5 of 10 plausible model-written lines refused. Until the count is durable, there is no way to tell a pack that was generated thin from one that was gutted - and those need opposite responses"
