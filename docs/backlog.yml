- id: "N36"
  state: "actionable"
  title: "**OWNER REQUEST 2026-09-20, second-highest priority. Copying the résumé loses its bullets.** The copy path is a union of three mechanisms in `lib/clipboard/plainText.js`, and it already carries an optional `text/html` flavour alongside `text/plain` (AC-C7 amendment) so a paste into Word or Google Docs can keep formatting. **The plain-text flavour provably cannot carry a bullet today, and the cause is located**: `lib/document/htmlToPlainText.js` walks the rendered HTML with only three special cases, and its own header states that containers \"like `<ul>`/`<table>`\" are pure containers that contribute NOTHING, while block elements contribute one line. So an `<li>` yields its text and a newline, and **no bullet marker is ever emitted** — a résumé’s achievement bullets paste into an ATS field, a plain-text email, or any plain target as an undifferentiated run of lines. **This is the high-value target**: the plain flavour is what every ATS form receives. **What is NOT yet established, and must be measured before anything is changed** — (a) whether the `text/html` flavour actually carries real `<ul>/<li>` markup or already flattens lists upstream, which decides whether the rich paste is also broken or only the plain one; (b) whether the bullets survive in the DOCX download path, which is a different pipeline entirely; (c) **whether the rich flavour lands at all** — backlog **V1** records that rich résumé copy has NEVER touched a real clipboard: the unit tests prove both flavours are set with the right payloads, each with a negative control, but nobody has ever pasted into Word or Google Docs. V1 must be discharged as part of this, because a fix to a path nobody has observed is unfalsifiable. **TRAPS**: `text/html` rides ONLY the copy-event channel (`via:\"copyEvent\"`), so a browser taking the async or textarea path gets plain text no matter what — any fix that lives only in the HTML flavour silently does nothing on those paths, which is precisely why the PLAIN flattener is the one that must emit a marker. Do not add a `ClipboardItem` path (AC-C7 forbids it), do not disturb the frozen six-row return union or the step ordering, and do not hoist the edit-mode fence — each is load-bearing and documented at length in the module header"
  owed_by: "A chunk that first MEASURES all three paths (plain, text/html, DOCX) against a real paste target, discharging V1, then fixes the plain-text flattener to emit a marker"
  evidence: ["`lib/document/htmlToPlainText.js` — header states `<ul>`-class elements are pure containers contributing nothing; blocks add one line, so no bullet marker is emitted", "`lib/clipboard/plainText.js:34-41` (the `text/html` flavour) and `:116-173` (`attemptCopyEvent`, the ONLY channel that can carry it)", "`app/components/preview/CopyDocumentControl.js:54` — `writePlainText(text, { mode, html })`, the single call site", "backlog **V1** — rich résumé copy has never touched a real clipboard; must be discharged here"]
