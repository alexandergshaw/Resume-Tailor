- id: "N18"
  state: "actionable"
  title: "**Answered questions must STAY on screen, and a newly detected question must not take the panel until the candidate confirms it.** Owner request, 2026-09-14, prioritized ABOVE the prep pack. **The workflow, in the owner's own words**: live copilot mode is running; the interviewer asks a question; the app detects it; the app answers it **and asks before displaying the answer**; the candidate clicks yes; the answer displays. Repeat: the candidate clicks display for the next question/answer, that answer displays, **and the previous question/answer goes into a collapsible list** the candidate can scroll back to and re-open. **What exists today, and why this is a semantics change not an addition**: `lib/copilot/currentQuestion.js` decides ONE current entry (the latest non-provisional, AC-M1.3.5) and `lib/copilot/questionPin.js` adds a **time-bounded** hold on top of it (AC-T1.16..T1.16.3) — so a newer question eventually wins on its own. The owner is asking for the hold to be **indefinite and candidate-controlled**: nothing advances without an explicit confirm, and nothing is ever evicted, only collapsed. `newerQuestionCount` already exists in `currentQuestion.js` and is the natural signal for \"N waiting\". **Design questions a round must settle before code**: (a) what happens to a generated answer the candidate never confirms — is it kept, discarded, or regenerated on expand, and does it still cost a model call; (b) whether confirmation gates GENERATION or only DISPLAY (the owner's wording is display — the app answers, THEN asks — which means the spend happens before the confirm, and that should be stated rather than assumed); (c) how the collapsed list behaves when an interview runs long (no cap, or a cap with what eviction rule — the owner's requirement is that nothing is lost, so a cap needs an explicit ruling); (d) what a queue of unconfirmed questions looks like when three arrive in one breath — strictly ordered, or can the candidate pick out of order. **Constraint**: the standing minimize-clicks directive is deliberately overridden here for ONE click (the confirm) because the owner asked for it by name; it is not a licence to add a second"
  owed_by: "A design round (1c UX + 1b structure) settling the four questions above, then the wave that builds it"
  evidence: ["`lib/copilot/currentQuestion.js` (single-current decision, AC-M1.3.5, and `newerQuestionCount`)", "`lib/copilot/questionPin.js` (today's TIME-bounded hold, AC-T1.16..T1.16.3)", "`app/copilot/QuestionFeed.js` and `app/copilot/dashboard/CopilotDashboard.js` (the surface)", "[[minimize-clicks]] — overridden for exactly one confirm, by owner request"]
