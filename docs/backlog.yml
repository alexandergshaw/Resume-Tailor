- id: "N29"
  state: "actionable"
  title: "**The prep pack can only be kicked off automatically; a tracking row needs a manual \"prepare me for this interview\" control.** Owner request, 2026-09-15. Today generation fires only as a side effect of tailoring - `startInterviewPrepResearch` (`lib/interviewPrep/prepTrigger.js:51`) is called from exactly two places, `app/page.js:1655` (trigger class B3) and `app/hooks/useManualPostings.js:280` (B1) - so a candidate who tailored a posting last week, or who wants a second pass before an interview tomorrow, has no way to ask for one. **The tracking row is the right home and is already the only surface that HAS what the trigger needs**: `app/components/tracking/ApplicationCard.js` renders per-row actions (`:178` JD, `:181` Resume, `:200` Comms, `:222` Edit) against a row carrying a real `application_id` - which is precisely what backlog **N13** records as MISSING at two of the five existing call sites, where `tailorPosting` returns only a `jobId` and the blank-id refusal silently swallows the call. A tracking-row button has no such gap. **Coupled to N25, and the pairing matters**: there is no read surface, so a manual kick-off today would spend a capped attempt and show the candidate nothing at all - no running state, no result, no failure. Build them together, or build N25 first. **A fire-and-forget button with no feedback is worse than no button.** **Design questions**: (a) what the control shows across the four states (never generated / running / ready / failed) - the row already reads pack status via `listPrepPacks`, which is browser-safe by design; (b) what it says when the caps are spent (`attempts >= 6` or `model_calls >= 12`) rather than letting the click fail silently - `claimPrepPack` already returns a distinct `attempts-spent` reason; (c) whether a re-run replaces the stored pack or offers a choice, given `writePrepPackResult` is a plain UPDATE and O-16’s delete control exists separately; (d) the standing [[minimize-clicks]] directive - one action with good defaults, not a menu then a confirm. **Trigger class**: this is a new, candidate-initiated class distinct from B1/B3, and `interview_prep_events.trigger_class` is CHECK-bounded to `(\"B1\", \"B3\")` (`20260914000000_interview_prep.sql:406-407`), so a manual trigger needs either a migration adding its own value or an explicit ruling to reuse one - **it cannot just be passed through**"
