- id: "N22"
  state: "actionable"
  title: "**Five findings against the SHIPPED N12 lockdown migration, plus the owner-ruled cleanup it must carry.** A fresh adversarial check ran against `3d9bb27` AFTER it was pushed (it shipped on a design round and a self-report, with no check — that omission is the reason these exist). `supabase/migrations/20260915000000_interview_prep_spend_lockdown.sql` is NOT yet applied, so all of this is corrected IN PLACE rather than chased with a further migration. **(1) The execute-grant replay is provably wrong against this repo own files.** `interviewPrepEffectiveSchema.test.js:386-389` requires the literal word `execute` and an exact-byte signature match; run verbatim over the real migrations it reports PUBLIC holds EXECUTE on `prune_feed_postings`, which `20260612000000_feed_postings_retention.sql:33` explicitly revokes with `revoke all on function`. Five further re-grant spellings are invisible. Fix: match `execute|all`, `function|routine`, normalise the signature, split the role list, and add `prune_feed_postings` as a control in THAT describe block. **(2) The table-grant replay is evadable by seven legal spellings**, including this repo own house style: `grant select on table x to anon, authenticated;` (`20260609010000_feed_grants.sql:12`) is dropped entirely by the regex at `:160`. Also missed: no `ON TABLE` keyword, multi-table, `with grant option`, quoted role, unqualified table, and a `do $$ ... execute ... $$` block. **(3) The migration never names `anon`.** It revokes EXECUTE from `public` and table privileges from `authenticated` only, while both precedents it cites do both (`feed_postings_retention.sql:33-34`), and `20260908000000_positions_policy_hardening.sql:155-163` ALREADY RULED that on Supabase an omission is not an absence. `revoke ... from public` does not remove an explicit `anon` grant, so the file headline claim may be false and `anon` may still hold INSERT/UPDATE on the spend table. **(4) The `42501` raise is permanently reachable and the migration ships no remedy.** Its comment says that should never happen; it happens on any project where the still-open N12 hole was used. A squatted spend row keyed to a victim application makes every future claim for that victim abort, forever, with no user-reachable escape (`authenticated` has no DELETE grant or policy on that table, deliberately). **OWNER RULING, 2026-09-15: the migration CLEANS UP cross-tenant rows** rather than refusing to apply and reporting them. Delete, before the function is replaced, every `interview_prep_spend` and `interview_prep_packs` row whose `user_id` does not match its application owner - by definition only the exploit can have created one, so nothing legitimate is lost. The deletion must be counted and reported in the migration output, and V2 query (7) stays as the post-apply confirmation that zero remain. **(5) The migration states a FALSE fact about Postgres** at `:245-250` - it claims a bare `revoke update` does not reach a column-scoped grant; the REVOKE reference says the opposite, column privileges are revoked automatically. The `expandPrivilege` model in the test inherits the error, so a future author who simplifies CORRECTLY gets a false red"
