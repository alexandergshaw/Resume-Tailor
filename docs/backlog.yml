- id: "N31"
  state: "actionable"
  title: "**The backlog's hand-set priority order never reaches any of its own consumers — every one of them re-sorts by numeric id.** `docs/backlog.yml` is ordered by priority by hand (commit `674a915`: \"reorder\"), and `compareIds` (`hello-world/scripts/backlog/lib/idOrder.mjs`) discards that order at **8 call sites**: `renderMarkdown.mjs:28,29,30` (all three generated tables), `pick.mjs:30,38,47,50` (scoped, unscoped, owner, verification), `wave.mjs:30`. **Consequence, observed not predicted**: `docs/BACKLOG.md` instructs its reader \"Work it. Top to bottom\" while displaying N2 first when the owner's top priority is N30/N26 — this session opened on the wrong item because of it and the owner corrected the pick by hand. `next.mjs` and `wave.mjs` recommend the lowest-numbered id rather than the highest-priority item. **It has ALREADY fired unnoticed in a second namespace**: `git show 3d9bb27:docs/backlog.yml` places `V2` above `V1`, held that way for five commits while the rendered document showed `V1` first — so the defect is not confined to the actionable section, and any fix that treats owner/verification items as genuinely age-ordered is wrong (an AC round ruled exactly that and was refuted on this evidence). **Proposed shape**: source-file order IS priority order in all three sections, implicit rather than a `priority:` integer field (numbers rot; the owner already reorders by hand); every \"what is next\" path drops its `.sort(compareIds)`; the now-load-bearing ordering is STATED in `backlog.yml`'s header and in `renderMarkdown.mjs`'s `BLOCK_A` rules block; `pick.mjs`'s doc comment calling the escalate branch \"oldest\" is a stale comment describing an intent the data contradicts and must be corrected. **Two things a resumed round must carry, both proven by a check**: (a) **one instrument per call site** — single-site mutants at `pick.mjs:50` and `renderMarkdown.mjs:30` leave all 76 landed tests green, so \"four sites, two instruments\" is a zero-power gate; (b) **the class defect, not the 8 instances** — a future `yamlLite.mjs` that builds items via an id-keyed object, or any consumer re-introducing a sort, reproduces this with every test green. **Confirmed sound and not to be re-litigated**: the landed-test change list is exact (a fix-all-4 mutant broke exactly 3 named tests of 80), `wave.test.js`'s fixtures are non-discriminating, and ids ARE monotonic — which is precisely why id order looks correct until it is not. **DEPRIORITIZED BY THE OWNER, 2026-09-15**, mid-round: ~4 agents deep on what amounts to deleting four `.sort()` calls. Artifacts preserved at `<scratchpad>/chunks/BL-ORDER/` (`ac.r1.md`, `check-ac.r1.md`, `ledger.md` with rulings R-BL-1/R-BL-2)"
